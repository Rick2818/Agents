name: Explee AutoGTM Hot Leads Watchdog 24/7

on:
  schedule:
    # Corre cada 30 minutos 24/7 para detectar respuestas de interés inmediato
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual con 1 clic desde GitHub

permissions:
  contents: write

jobs:
  poll-hot-leads:
    name: Poll Explee Hot Leads & Alert Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install dotenv

      - name: Poll Hot Leads & Dispatch Telegram Notifications
        env:
          EXPLEE_API_KEY: ${{ secrets.EXPLEE_API_KEY || 'sk_explee_1b88c1d00ed1c72e61bb932ed29893058daf652b9b5af1f0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8685630383:AAEfpeM5CXXKYL6YSkUZk64i2cVjYNY-QbM' }}
          TELEGRAM_AUTHORIZED_USER_ID: ${{ secrets.TELEGRAM_AUTHORIZED_USER_ID || '6311509947' }}
        run: node scripts/outbound/poll_explee_hot_leads.mjs

      - name: Commit & Persist Hot Leads State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/explee_hot_leads_*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(explee): update hot leads tracking state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Sin cambios en estado de hot leads — nada que commitear."
          fi
