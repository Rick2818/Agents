name: Autonomous Hunter 24/7

on:
  schedule:
    # Corre automáticamente cada 12 horas desatendido en los servidores de GitHub
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite ejecución manual con 1 clic desde GitHub

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 24/7 Autonomous Hunter & Generate Opportunities
        run: node scripts/outbound/run_cron_hunter.mjs

      - name: Commit & Persist Pipeline Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): update autonomous audit results [skip ci]" && git push)
