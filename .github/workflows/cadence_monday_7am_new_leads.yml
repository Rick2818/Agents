name: Cadence Monday 7:00 AM - New Leads + Video Briefing

on:
  schedule:
    # Corre los lunes a las 7:00 AM CST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Permite ejecución manual con 1 clic desde GitHub Actions

permissions:
  contents: write

jobs:
  dispatch_new_leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute 7:00 AM New Cohort Cadence with 70s Video Briefing
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.RESFND_APT_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'ricardo.destrabaai@gmail.com' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || 'Destraba AI <ricardo.destrabaai@gmail.com>' }}
          STRIKE_LIGHTNING_ADDRESS: ${{ secrets.STRIKE_LIGHTNING_ADDRESS || 'rick2818@strike.me' }}
          OFFICIAL_SUPPORT_EMAIL: ${{ secrets.OFFICIAL_SUPPORT_EMAIL || 'ricardo.destrabaai@gmail.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_AUTHORIZED_USER_ID: ${{ secrets.TELEGRAM_AUTHORIZED_USER_ID || '6311509947' }}
          BATCH_LIMIT: '25'
          CADENCE_ACTION: 'impact_1_new_leads'
        run: node scripts/outbound/run_cron_hunter.mjs

      - name: Commit & Persist Pipeline Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/
          if ! git diff --staged --quiet; then
            git commit -m "chore(pipeline): record monday 7am new leads dispatch [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "Sin cambios en pipeline/ — nada que commitear."
          fi
