[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-generator"
version = "0.1.0"
description = "MCP Server and Multi-Agent Engine to transform business ideas into autonomous multi-agent systems for Google Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
mcp-generator = "main:main"
